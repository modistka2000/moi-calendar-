<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь — Мой календарь</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <style>
    /*
    ============================================================
    БЛОК 1. ОФОРМЛЕНИЕ

    Основные цвета можно изменить в :root.
    Макет автоматически перестраивается для телефона.
    ============================================================
    */

    :root {
      color-scheme: light;
      --background: #efc6ee;
      --surface: hsl(196, 57%, 82%);
      --text: #29334b;
      --muted: #768198;
      --border: #e3e8f2;
      --primary: #596fca;
      --primary-light: #eef1ff;
      --danger: #b64c60;
      --warning: #9a7137;
      --control: #ffffff;
      --outside: #fafbfe;
      --outside-text: #a6afbf;
      --selected: #eef1ff;
      --chip: #f0f2f8;
      --hint-bg: #f3f5fa;
      --warning-bg: #fff6e7;
      --upload-border: #c4cee8;
      --upload-bg: #f8faff;
      --source-bg: #f6f7fa;
      --backdrop: #26324c66;
      --toast-bg: #29334b;
      --toast-text: #ffffff;
      --radius: 16px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --background: #141924;
      --surface: #1e2433;
      --text: #e7ebf5;
      --muted: #96a2b8;
      --border: #323a4e;
      --primary: #667ee0;
      --primary-light: #2c3554;
      --danger: #e08a9a;
      --warning: #e3b56a;
      --control: #171d2a;
      --outside: #171c28;
      --outside-text: #6d7890;
      --selected: #2c3554;
      --chip: #171d2a;
      --hint-bg: #171d2a;
      --warning-bg: #3a2e1c;
      --upload-border: #3d4a68;
      --upload-bg: #171d2a;
      --source-bg: #171d2a;
      --backdrop: #07090f99;
      --toast-bg: #e7ebf5;
      --toast-text: #141924;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--control);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-light);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button.primary {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    button.danger {
      color: var(--danger);
    }

    button.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    a.home-link {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--control);
      color: var(--text);
      text-decoration: none;
    }

    a.home-link:hover {
      background: var(--primary-light);
    }

    .welcome-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .welcome-banner p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--control);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    h1 {
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 21px;
    }

    h3 {
      font-size: 16px;
    }

    small, .muted {
      color: var(--muted);
    }

    .app {
      max-width: 1250px;
      margin: auto;
      padding: 28px 20px;
    }

    .header, .toolbar, .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header, .toolbar {
      justify-content: space-between;
    }

    .header {
      margin-bottom: 24px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .navigation {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 20px;
    }

    .calendar-card {
      padding: 0;
      overflow: hidden;
    }

    .toolbar {
      padding: 18px;
    }

    .toolbar h2 {
      margin: 0;
      text-transform: capitalize;
    }

    .layout-single {
      grid-template-columns: minmax(0, 1fr);
    }

    .view-switch {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .view-hint {
      margin: 0 18px 14px;
    }

    .day-schedule {
      padding: 0 18px 18px;
    }

    .agenda-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .agenda-time {
      padding-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .day-schedule .primary {
      margin-top: 8px;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding: 0 18px 18px;
    }

    .mini-month {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: var(--control);
    }

    button.mini-title,
    button.mini-day {
      border: 0;
      background: transparent;
      padding: 0;
    }

    button.mini-title {
      width: 100%;
      margin-bottom: 8px;
      padding: 4px 2px;
      text-align: left;
      font-weight: 650;
      text-transform: capitalize;
    }

    .mini-weekdays,
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
    }

    .mini-weekdays span {
      color: var(--muted);
      font-size: 9px;
      text-align: center;
    }

    button.mini-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 32px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1;
    }

    button.mini-title:hover,
    button.mini-day:hover {
      background: var(--primary-light);
    }

    button.mini-day.today {
      color: white;
      background: var(--primary);
    }

    button.mini-day.selected {
      background: var(--selected);
      color: var(--text);
    }

    button.mini-day.today.selected,
    button.mini-day.today:hover {
      color: white;
      background: var(--primary);
    }

    button.mini-day.has-events::after {
      content: "";
      width: 5px;
      height: 5px;
      margin-top: 2px;
      border-radius: 50%;
      background: var(--event-color, var(--primary));
    }

    button.mini-day.today.has-events::after {
      background: white;
    }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .day {
      min-width: 0;
      min-height: 105px;
      padding: 7px;
      border: 0;
      border-radius: 0;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: left;
      overflow: hidden;
    }

    .day:nth-child(7n) {
      border-right: 0;
    }

    .day.outside {
      background: var(--outside);
      color: var(--outside-text);
    }

    .day.selected {
      background: var(--selected);
    }

    .day-number {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 12px;
    }

    .day.today .day-number {
      color: white;
      background: var(--primary);
    }

    .event-chip {
      display: block;
      margin-top: 5px;
      padding: 4px;
      border-left: 3px solid var(--event-color);
      border-radius: 4px;
      background: var(--chip);
      color: var(--text);
      font-size: 10px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .entry {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .entry-main {
      flex: 1;
      min-width: 0;
    }

    .entry-main button {
      padding: 0;
      border: 0;
      background: none;
      text-align: left;
      line-height: 1.5;
    }

    .entry-main small {
      display: block;
      margin-top: 6px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .dot {
      width: 9px;
      height: 9px;
      margin-top: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .completed {
      text-decoration: line-through;
      opacity: .55;
    }

    .empty {
      padding: 28px 10px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .hint {
      padding: 13px;
      border-radius: 9px;
      background: var(--hint-bg);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .warning {
      color: var(--warning);
      background: var(--warning-bg);
    }

    .upload {
      border: 2px dashed var(--upload-border);
      border-radius: 14px;
      padding: 25px;
      background: var(--upload-bg);
      margin-bottom: 18px;
    }

    .upload input {
      background: var(--control);
    }

    .draft {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
    }

    .draft-content {
      flex: 1;
      min-width: 0;
    }

    .draft-content p {
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .source {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 200px;
      overflow: auto;
      padding: 12px;
      background: var(--source-bg);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
    }

    .status {
      white-space: pre-wrap;
      color: var(--primary);
      font-size: 13px;
      line-height: 1.8;
      margin: 15px 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .error {
      color: var(--danger);
      line-height: 1.7;
      font-size: 13px;
    }

    dialog {
      width: min(640px, calc(100% - 24px));
      max-height: 92vh;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      color: var(--text);
      background: var(--surface);
    }

    dialog::backdrop {
      background: var(--backdrop);
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .dialog-head h2 {
      margin: 0;
    }

    .preview-image {
      max-width: 100%;
      max-height: 240px;
      object-fit: contain;
      margin-top: 10px;
    }

    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 92%;
      padding: 14px 20px;
      border-radius: 10px;
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 13px;
      z-index: 100;
      display: none;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .year-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .app {
        padding: 20px 10px;
      }

      .card {
        padding: 16px;
      }

      .calendar-card {
        padding: 0;
      }

      .day {
        min-height: 85px;
        padding: 4px;
      }

      .event-chip {
        font-size: 9px;
      }

      .toolbar {
        padding: 14px;
      }

      .toolbar h2 {
        font-size: 17px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .draft {
        flex-wrap: wrap;
      }

      button, a.home-link {
        padding: 9px 11px;
        font-size: 13px;
      }

      .welcome-banner {
        align-items: stretch;
        flex-direction: column;
      }

      .navigation {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .navigation button {
        width: 100%;
      }

      .year-grid {
        grid-template-columns: 1fr;
      }

      .agenda-row {
        grid-template-columns: 72px minmax(0, 1fr);
      }
    }
  </style>
  <script>
    try {
      var savedTheme = localStorage.getItem("my-calendar-theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {
      // Без хранилища останется светлая тема.
    }
  </script>
</head>

<body>
  <!--
  ============================================================
  БЛОК 2. HTML-СТРУКТУРА

  JavaScript наполняет #app данными.
  dialog используется для создания и редактирования записей.
  ============================================================
  -->

  <main class="app" id="app"></main>
  <dialog id="editorDialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /*
    ============================================================
    БЛОК 3. НАСТРОЙКИ И ХРАНЕНИЕ

    Записи сохраняются в localStorage текущего браузера.
    Если редактор блокирует хранилище, приложение продолжит
    работать, но предупредит об отсутствии сохранения.

    Для переноса данных используйте JSON-копию.
    ============================================================
    */

    const STORAGE_KEY = "my-calendar-single-file-v1";

    const TYPES = [
      "event",
      "task",
      "webinar",
      "activation",
      "appointment"
    ];

    const COLORS = {
      event: "#6983c9",
      task: "#c6a05d",
      webinar: "#a18ac8",
      activation: "#70a38b",
      appointment: "#cc889a"
    };

    const ZONES = [
      "America/New_York",
      "America/Chicago",
      "America/Denver",
      "America/Los_Angeles",
      "Europe/Moscow",
      "Europe/London",
      "Europe/Paris",
      "Asia/Dubai",
      "Asia/Shanghai",
      "UTC"
    ];

    let state = {
      language: "ru",
      zone: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC",
      entries: [],
      drafts: [],
      view: "month"
    };

    let storageAvailable = true;

    try {
      const saved = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "null"
      );

      if (
        saved &&
        Array.isArray(saved.entries) &&
        Array.isArray(saved.drafts)
      ) {
        state = { ...state, ...saved };
      }
    } catch {
      storageAvailable = false;
    }

    if (!["day", "month", "year"].includes(state.view)) {
      state.view = "month";
    }

    let today = new Date();
    let currentMonth = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

    let selectedDate = dateKey(today);
    let currentPage = "calendar";
    let categoryFilter = "";
    let importBusy = false;
    let importStatus = "";
    let editing = null;
    let ocrWorker = null;
    let toastTimer = null;

    const sourceImages = new Map();
    const scriptPromises = new Map();
    const deliveredReminders = new Set();

    const app = document.getElementById("app");
    const dialog = document.getElementById("editorDialog");

    /*
    ============================================================
    БЛОК 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    ============================================================
    */

    function tr(ru, en) {
      return state.language === "ru" ? ru : en;
    }

    function locale() {
      return state.language === "ru" ? "ru-RU" : "en-US";
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[character])
      );
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function dateKey(date) {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");
    }

    function localDate(value) {
      return new Date(value + "T12:00:00");
    }

    function validDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) {
        return false;
      }

      const year = Number(value.slice(0, 4));

      // Явная граница этой версии календаря.
      return (
        year >= 1900 &&
        year <= 2099 &&
        dateKey(localDate(value)) === value
      );
    }

    function validTime(value) {
      return /^([01]\d|2[0-3]):[0-5]\d$/.test(value || "");
    }

    function validZone(zone) {
      if (!zone) return false;

      try {
        new Intl.DateTimeFormat("en", { timeZone: zone });
        return true;
      } catch {
        return false;
      }
    }

    function createId() {
      if (globalThis.crypto?.randomUUID) {
        return crypto.randomUUID();
      }

      return (
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).slice(2)
      );
    }

    function formatDate(value, includeYear = false) {
      if (!validDate(value)) return "—";

      return localDate(value).toLocaleDateString(locale(), {
        day: "numeric",
        month: "long",
        ...(includeYear ? { year: "numeric" } : {})
      });
    }

    function typeName(type) {
      return {
        event: tr("Событие", "Event"),
        task: tr("Задача", "Task"),
        webinar: tr("Вебинар", "Webinar"),
        activation: tr("Активация", "Activation"),
        appointment: tr("Встреча", "Appointment")
      }[type] || type;
    }

    function repeatName(repeat) {
      return {
        none: tr("Не повторять", "Does not repeat"),
        daily: tr("Каждый день", "Every day"),
        weekly: tr("Каждую неделю", "Every week"),
        monthly: tr("Каждый месяц", "Every month")
      }[repeat];
    }

    function showToast(message) {
      const element = document.getElementById("toast");
      element.textContent = message;
      element.style.display = "block";

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        element.style.display = "none";
      }, 6500);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        storageAvailable = true;
      } catch {
        storageAvailable = false;

        showToast(tr(
          "Браузер не сохранил данные. Скачайте JSON-копию.",
          "The browser could not save data. Download a JSON backup."
        ));
      }
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /*
    ============================================================
    БЛОК 5. ПОВТОРЕНИЯ И ЧАСОВЫЕ ПОЯСА

    Дата во встроенном календаре относится к часовому поясу
    самой записи. Все события не переводятся в один общий пояс.

    Ежемесячная запись на 31-е пропускает месяцы без 31-го.
    ============================================================
    */

    function occursOn(entry, day) {
      if (!validDate(entry.date) || day < entry.date) return false;
      if (entry.until && day > entry.until) return false;
      if (day === entry.date) return true;

      const difference = Math.round(
        (localDate(day) - localDate(entry.date)) / 86400000
      );

      if (entry.repeat === "daily") return true;
      if (entry.repeat === "weekly") return difference % 7 === 0;

      if (entry.repeat === "monthly") {
        return (
          localDate(day).getDate() ===
          localDate(entry.date).getDate()
        );
      }

      return false;
    }

    function entriesOn(day) {
      return state.entries
        .filter(entry =>
          (!categoryFilter || entry.type === categoryFilter) &&
          occursOn(entry, day)
        )
        .sort((a, b) =>
          (a.time || "00:00").localeCompare(b.time || "00:00")
        );
    }

    /*
    Перевод местного времени записи в UTC.

    Если время попало в пропущенный или повторённый час при
    сезонном переводе часов, требуется ручное уточнение.
    */

    function toUTC(date, time, zone) {
      if (
        !validDate(date) ||
        !validTime(time) ||
        !validZone(zone)
      ) {
        throw new Error("Invalid date, time or time zone");
      }

      const target = Date.parse(date + "T" + time + ":00Z");

      const formatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: zone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      });

      function wallTime(timestamp) {
        const parts = Object.fromEntries(
          formatter.formatToParts(new Date(timestamp))
            .map(part => [part.type, part.value])
        );

        return Date.parse(
          `${parts.year}-${parts.month}-${parts.day}` +
          `T${parts.hour}:${parts.minute}:${parts.second}Z`
        );
      }

      const offsets = new Set(
        [-86400000, 0, 86400000].map(difference => {
          const timestamp = target + difference;
          return wallTime(timestamp) - timestamp;
        })
      );

      const matches = [...offsets]
        .map(offset => target - offset)
        .filter(timestamp => wallTime(timestamp) === target);

      if (matches.length !== 1) {
        throw new Error("Ambiguous or nonexistent local time");
      }

      return new Date(matches[0]);
    }

    function missingFields(entry) {
      const errors = [];

      if (!String(entry.title || "").trim()) {
        errors.push(tr("название", "title"));
      }

      if (!validDate(entry.date)) {
        errors.push(tr(
          "дата и год в диапазоне 1900–2099",
          "date and year in the 1900–2099 range"
        ));
      }

      if (!entry.allDay && !validTime(entry.time)) {
        errors.push(tr(
          "время или отметка «Весь день»",
          "time or the “All day” option"
        ));
      }

      if (!validZone(entry.zone)) {
        errors.push(tr("часовой пояс", "time zone"));
      }

      if (
        !entry.allDay &&
        entry.end &&
        (!validTime(entry.end) || entry.end <= entry.time)
      ) {
        errors.push(tr(
          "окончание позже начала в тот же день",
          "end time after start on the same day"
        ));
      }

      if (
        entry.until &&
        (!validDate(entry.until) || entry.until < entry.date)
      ) {
        errors.push(tr(
          "дата окончания повторений",
          "recurrence end date"
        ));
      }

      if (
        validDate(entry.date) &&
        validTime(entry.time) &&
        validZone(entry.zone) &&
        !entry.allDay
      ) {
        try {
          toUTC(entry.date, entry.time, entry.zone);

          if (entry.end) {
            toUTC(entry.date, entry.end, entry.zone);
          }
        } catch {
          errors.push(tr(
            "время при переходе часов — выберите однозначное",
            "time during a clock change — choose an unambiguous time"
          ));
        }
      }

      return errors;
    }

    function isDuplicate(entry) {
      return state.entries.some(existing =>
        existing.id !== entry.id &&
        existing.title.trim().toLowerCase() ===
          entry.title.trim().toLowerCase() &&
        existing.date === entry.date &&
        existing.time === entry.time &&
        existing.zone === entry.zone
      );
    }

      let added = 0;

      for (const sample of samples) {
        const entry = {

    const THEME_KEY = "my-calendar-theme";

    function currentTheme() {
      return document.documentElement.dataset.theme === "dark"
        ? "dark"
        : "light";
    }

    function toggleTheme() {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;

      try {
        localStorage.setItem(THEME_KEY, next);
      } catch {
        // Переключение применится до закрытия страницы.
      }

      render();
    }

    function setLanguage(language) {
      state.language = language;
      saveState();
      render();
    }

    function setPage(page) {
      currentPage = page;
      render();
    }

    function changeMonth(offset) {
      currentMonth = new Date(
        currentMonth.getFullYear(),
        currentMonth.getMonth() + offset,
        1
      );

      render();
    }

    function setCalendarView(view) {
      if (!["day", "month", "year"].includes(view)) return;

      state.view = view;
      const date = localDate(selectedDate);
      currentMonth = new Date(date.getFullYear(), date.getMonth(), 1);
      saveState();
      render();
    }

    function shiftPeriod(offset) {
      if (state.view === "day") {
        const date = localDate(selectedDate);
        date.setDate(date.getDate() + offset);
        selectedDate = dateKey(date);
        currentMonth = new Date(
          date.getFullYear(),
          date.getMonth(),
          1
        );
        render();
        return;
      }

      if (state.view === "year") {
        currentMonth = new Date(
          currentMonth.getFullYear() + offset,
          currentMonth.getMonth(),
          1
        );
        render();
        return;
      }

      changeMonth(offset);
    }

    function periodLabel() {
      if (state.view === "day") {
        return localDate(selectedDate).toLocaleDateString(locale(), {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
      }

      if (state.view === "year") {
        return String(currentMonth.getFullYear());
      }

      return currentMonth.toLocaleDateString(locale(), {
        month: "long",
        year: "numeric"
      });
    }

    function periodStepLabel(offset) {
      const previous = offset < 0;

      if (state.view === "day") {
        return previous
          ? tr("Предыдущий день", "Previous day")
          : tr("Следующий день", "Next day");
      }

      if (state.view === "year") {
        return previous
          ? tr("Предыдущий год", "Previous year")
          : tr("Следующий год", "Next year");
      }

      return previous
        ? tr("Предыдущий месяц", "Previous month")
        : tr("Следующий месяц", "Next month");
    }

    function openMonth(year, month) {
      currentMonth = new Date(Number(year), Number(month), 1);
      state.view = "month";
      saveState();
      render();
    }

    function goToday() {
      const date = new Date();

      selectedDate = dateKey(date);
      currentMonth = new Date(
        date.getFullYear(),
        date.getMonth(),
        1
      );

      render();
    }

    function selectDay(day, nextView) {
      selectedDate = day;
      const date = localDate(day);
      currentMonth = new Date(date.getFullYear(), date.getMonth(), 1);

      if (nextView === "day" || nextView === "month") {
        state.view = nextView;
        saveState();
      }

      render();
    }

    function setFilter(value) {
      categoryFilter = value;
      render();
    }

    function renderCalendarToolbar() {
      return `
        <div class="toolbar">
          <div class="row">
            <button onclick="shiftPeriod(-1)"
              aria-label="${periodStepLabel(-1)}">
              ‹
            </button>

            <h2>${periodLabel()}</h2>

            <button onclick="shiftPeriod(1)"
              aria-label="${periodStepLabel(1)}">
              ›
            </button>
          </div>

          <div class="row">
            <div class="view-switch" role="group"
              aria-label="${tr("Вид расписания", "Schedule view")}">
              ${[
                ["day", tr("День", "Day")],
                ["month", tr("Месяц", "Month")],
                ["year", tr("Год", "Year")]
              ].map(([view, label]) => `
                <button

                  onclick="setCalendarView('${view}')">
                  ${label}
                </button>
              `).join("")}
            </div>
